[project]
name = "IND320"
version = "3.00"
# pyspark 3.5.1 (Oblig2) does not support newer Python versions
requires-python = ">=3.11,<3.12"

# What the Streamlit app and the ind320 package need. This is all Streamlit Cloud installs (uv sync)
dependencies = [
    "streamlit",
    "pandas",
    "numpy",
    "pyarrow",
    "plotly",
    "requests",
    "pymongo",
    "entsoe-py>=0.8.1",
    "geopandas>=1.2.0",
    "shapely",
    "scipy>=1.17.1",
    "scikit-learn",
    "statsmodels",
]

[dependency-groups]
# Only for the notebooks (Oblig1-3): the Jupyter kernel, matplotlib, and Cassandra and Spark for Oblig2.
# Not installed on Streamlit Cloud. Install everything locally with: uv sync --all-groups
notebook = [
    "ipykernel",
    "matplotlib",
    "cassandra-driver",
    "pyspark==3.5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ind320"]
