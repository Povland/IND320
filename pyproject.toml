[project]
name = "IND320"
version = "2026.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "ipykernel",
    "pip",
    "jupyter-book",
    "jupyterlab",
    "jupyterlab-deck",
    "jupyterlab_myst",
    "matplotlib",
    "numpy",
    "setuptools",
    "pandas",
    "openpyxl",
    "datetime",
    "requests",
    "river",
    "cassandra-driver",
    "pyspark==3.5.1",
    "mysql.connector",
    "flask",
    "pybaselines",
    "pyjstat",
    "statsmodels",
    "hoggorm",
    "hoggormplot",
    "scikit-learn",
    "ipywidgets",
    "plotly",
    "anywidget",
    "pydub",
    "sounddevice",
    "kaleido",
    "lorem",
    "pymongo",
    "streamlit",
    "nbstripout",
    "python-dotenv>=1.2.4",
    "entsoe-py>=0.8.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ind320"]
